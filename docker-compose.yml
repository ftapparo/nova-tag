services:
  nova-tag-tag1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nova-tag-tag1
    restart: unless-stopped
    labels:
      - "autoheal=true"
    ports:
      - "4009:4000"
    # env_file removido: no Portainer (stack via Git), o .env nao esta no
    # clone (fica no .gitignore por conter segredos).
    #
    # IMPORTANTE: "Environment variables" da stack no Portainer NAO injeta
    # variaveis no container automaticamente - elas so ficam disponiveis
    # para interpolacao do compose (as referencias abaixo). Cada uma precisa
    # ser listada aqui explicitamente para chegar ao processo do container.
    environment:
      - NODE_ENV=production
      - TAG_ID=TAG1
      - PORT=4000
      - API_BASE_URL=${API_BASE_URL}
      - HEALTHCHECK_TIMEOUT=${HEALTHCHECK_TIMEOUT}
      - CONNECT_TIMEOUT_MS=${CONNECT_TIMEOUT_MS}
      - HEALTHCHECK_GUARD_MS=${HEALTHCHECK_GUARD_MS}
      - GATE_TIMEOUT_TO_CLOSE=${GATE_TIMEOUT_TO_CLOSE}
      - ATTEMPT_RECONNECT=${ATTEMPT_RECONNECT}
      - SHUTDOWN_DELAY_MS=${SHUTDOWN_DELAY_MS}
      - FILTER_DATA=${FILTER_DATA}
      - LOG_TO_FILE=${LOG_TO_FILE}
      - LOG_DIR=${LOG_DIR}
    volumes:
      - C:/Servidor/docker/logs:/app/logs
    networks:
      - nova-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:4000/v2/api/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nova-tag-tag2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nova-tag-tag2
    restart: unless-stopped
    labels:
      - "autoheal=true"
    ports:
      - "4010:4000"
    # env_file removido: no Portainer (stack via Git), o .env nao esta no
    # clone (fica no .gitignore por conter segredos).
    #
    # IMPORTANTE: "Environment variables" da stack no Portainer NAO injeta
    # variaveis no container automaticamente - elas so ficam disponiveis
    # para interpolacao do compose (as referencias abaixo). Cada uma precisa
    # ser listada aqui explicitamente para chegar ao processo do container.
    environment:
      - NODE_ENV=production
      - TAG_ID=TAG2
      - PORT=4000
      - API_BASE_URL=${API_BASE_URL}
      - HEALTHCHECK_TIMEOUT=${HEALTHCHECK_TIMEOUT}
      - CONNECT_TIMEOUT_MS=${CONNECT_TIMEOUT_MS}
      - HEALTHCHECK_GUARD_MS=${HEALTHCHECK_GUARD_MS}
      - GATE_TIMEOUT_TO_CLOSE=${GATE_TIMEOUT_TO_CLOSE}
      - ATTEMPT_RECONNECT=${ATTEMPT_RECONNECT}
      - SHUTDOWN_DELAY_MS=${SHUTDOWN_DELAY_MS}
      - FILTER_DATA=${FILTER_DATA}
      - LOG_TO_FILE=${LOG_TO_FILE}
      - LOG_DIR=${LOG_DIR}
    volumes:
      - C:/Servidor/docker/logs:/app/logs
    networks:
      - nova-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:4000/v2/api/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: nova-tag-autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=40
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock
    networks:
      - nova-network

networks:
  nova-network:
    external: true
    name: nova-network
