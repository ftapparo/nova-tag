services:
  nova-tag-tag1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nova-tag-tag1
    restart: unless-stopped
    labels:
      - "autoheal=true"
    ports:
      - "4009:4000"
      # v3 (Fastify) — em construcao, ainda sem rota publica dedicada no
      # Cloudflare Tunnel. Porta interna 3031 igual nos dois containers
      # (TAG1/TAG2), mapeada para portas externas diferentes.
      - "4019:3031"
    # env_file removido: no Portainer (stack via Git), o .env nao esta no
    # clone (fica no .gitignore por conter segredos).
    #
    # IMPORTANTE: "Environment variables" da stack no Portainer NAO injeta
    # variaveis no container automaticamente - elas so ficam disponiveis
    # para interpolacao do compose (as referencias abaixo). Cada uma precisa
    # ser listada aqui explicitamente para chegar ao processo do container.
    environment:
      - NODE_ENV=production
      # Fuso de Brasilia: o arquivo de log diario vira a 00:00 local (em UTC
      # virava as 21:00). O horario das linhas ja e fixado no logger.
      - TZ=America/Sao_Paulo
      - TAG_ID=TAG1
      - PORT=4000
      - PORT_V3=3031
      - SWAGGER_V3_ENABLED=${SWAGGER_V3_ENABLED}
      - TAG_SERVICE_TOKEN=${TAG_SERVICE_TOKEN}
      - API_BASE_URL=${API_BASE_URL}
      - API_V3_BASE_URL=${API_V3_BASE_URL}
      - API_SERVICE_TOKEN=${API_SERVICE_TOKEN}
      - HEALTHCHECK_TIMEOUT=${HEALTHCHECK_TIMEOUT}
      - CONNECT_TIMEOUT_MS=${CONNECT_TIMEOUT_MS}
      - HEALTHCHECK_GUARD_MS=${HEALTHCHECK_GUARD_MS}
      - GATE_TIMEOUT_TO_CLOSE=${GATE_TIMEOUT_TO_CLOSE}
      - COMMAND_RESPONSE_TIMEOUT_MS=${COMMAND_RESPONSE_TIMEOUT_MS:-5000}
      - SHUTDOWN_DELAY_MS=${SHUTDOWN_DELAY_MS}
      - GATE_AUTO_CLOSE_DEFAULT=${GATE_AUTO_CLOSE_DEFAULT:-15}
      - GATE_AUTO_CLOSE_MAX=${GATE_AUTO_CLOSE_MAX:-120}
      - GATE_COOLDOWN_MS=${GATE_COOLDOWN_MS:-3000}
      - TAG_WS_V3_MAX_CLIENTS=${TAG_WS_V3_MAX_CLIENTS:-5}
      - FILTER_DATA=${FILTER_DATA}
      - LOG_TO_FILE=${LOG_TO_FILE}
      - LOG_MAX_FILES=${LOG_MAX_FILES:-30d}
      - LOG_DIR=${LOG_DIR}
    volumes:
      - C:/Servidor/docker/logs:/app/logs
    networks:
      - nova-network
    # Intervalo curto: quando a antena nao responde nem apos a reconexao, o
    # processo sinaliza falha aqui e o autoheal faz stop/start do container.
    # Quanto antes o Docker marcar "unhealthy", antes o portao volta.
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:4000/v2/api/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nova-tag-tag2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nova-tag-tag2
    restart: unless-stopped
    labels:
      - "autoheal=true"
    ports:
      - "4010:4000"
      # v3 (Fastify) — em construcao, ainda sem rota publica dedicada no
      # Cloudflare Tunnel. Porta interna 3031 igual nos dois containers
      # (TAG1/TAG2), mapeada para portas externas diferentes.
      - "4020:3031"
    # env_file removido: no Portainer (stack via Git), o .env nao esta no
    # clone (fica no .gitignore por conter segredos).
    #
    # IMPORTANTE: "Environment variables" da stack no Portainer NAO injeta
    # variaveis no container automaticamente - elas so ficam disponiveis
    # para interpolacao do compose (as referencias abaixo). Cada uma precisa
    # ser listada aqui explicitamente para chegar ao processo do container.
    environment:
      - NODE_ENV=production
      # Fuso de Brasilia: o arquivo de log diario vira a 00:00 local (em UTC
      # virava as 21:00). O horario das linhas ja e fixado no logger.
      - TZ=America/Sao_Paulo
      - TAG_ID=TAG2
      - PORT=4000
      - PORT_V3=3031
      - SWAGGER_V3_ENABLED=${SWAGGER_V3_ENABLED}
      - TAG_SERVICE_TOKEN=${TAG_SERVICE_TOKEN}
      - API_BASE_URL=${API_BASE_URL}
      - API_V3_BASE_URL=${API_V3_BASE_URL}
      - API_SERVICE_TOKEN=${API_SERVICE_TOKEN}
      - HEALTHCHECK_TIMEOUT=${HEALTHCHECK_TIMEOUT}
      - CONNECT_TIMEOUT_MS=${CONNECT_TIMEOUT_MS}
      - HEALTHCHECK_GUARD_MS=${HEALTHCHECK_GUARD_MS}
      - GATE_TIMEOUT_TO_CLOSE=${GATE_TIMEOUT_TO_CLOSE}
      - COMMAND_RESPONSE_TIMEOUT_MS=${COMMAND_RESPONSE_TIMEOUT_MS:-5000}
      - SHUTDOWN_DELAY_MS=${SHUTDOWN_DELAY_MS}
      - GATE_AUTO_CLOSE_DEFAULT=${GATE_AUTO_CLOSE_DEFAULT:-15}
      - GATE_AUTO_CLOSE_MAX=${GATE_AUTO_CLOSE_MAX:-120}
      - GATE_COOLDOWN_MS=${GATE_COOLDOWN_MS:-3000}
      - TAG_WS_V3_MAX_CLIENTS=${TAG_WS_V3_MAX_CLIENTS:-5}
      - FILTER_DATA=${FILTER_DATA}
      - LOG_TO_FILE=${LOG_TO_FILE}
      - LOG_MAX_FILES=${LOG_MAX_FILES:-30d}
      - LOG_DIR=${LOG_DIR}
    volumes:
      - C:/Servidor/docker/logs:/app/logs
    networks:
      - nova-network
    # Intervalo curto: quando a antena nao responde nem apos a reconexao, o
    # processo sinaliza falha aqui e o autoheal faz stop/start do container.
    # Quanto antes o Docker marcar "unhealthy", antes o portao volta.
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:4000/v2/api/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: nova-tag-autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=40
      # Brasilia sem depender da base de fusos da imagem (sem horario de
      # verao desde 2019): o log do autoheal deixa de sair em UTC.
      - TZ=<-03>3
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock
    networks:
      - nova-network

networks:
  nova-network:
    external: true
    name: nova-network
